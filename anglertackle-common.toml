#抛投 / Casting
#注意：抛投已在 M2 改成**视角抛投**（低头近 / 平视中 / 抬头远），
#所以早期设计的"蓄力绿区 / 落点误差"配置项已删除 ——
#留着它们只会让人以为能调。
[cast]
	#蓄力到满所需秒数（只影响 HUD 蓄力条的显示节奏）
	# Default: 1.6
	# Range: 0.2 ~ 10.0
	chargeTimeSeconds = 1.6

#提竿窗口 / Hook window（用户定案：基础 2.0 秒）
[hookWindow]
	#基础窗口秒数（鱼钩/鱼竿加成会再加到它上面）
	# Default: 2.0
	# Range: 0.05 ~ 5.0
	base = 2
	#窗口下限秒数（加成算完后不会低于它）
	# Default: 1.0
	# Range: 0.05 ~ 5.0
	min = 1

#张力模型 / Tension（反馈以鱼线颜色为主，HUD 只做辅助）
#⚠ whiteMax / yellowMax 是**相对于基准张力上限 100** 的值：
#代码里按比例使用（whiteMax/100），好线把上限抬到 300 时
#白区黄区会同步放大，否则"好线反而全程红区"。
[tension]
	#收线时每 tick 增加的张力
	# Default: 0.9
	# Range: 0.0 ~ 20.0
	reelGain = 0.9
	#放线时每 tick 减少的张力
	# Default: 1.6
	# Range: 0.0 ~ 20.0
	releaseLoss = 1.6
	#不操作时每 tick 自然松弛的张力
	# Default: 0.35
	# Range: 0.0 ~ 20.0
	idleLoss = 0.35
	#白区（安全）上限，基准 100 的百分比
	# Default: 55.0
	# Range: 1.0 ~ 100.0
	whiteMax = 55
	#黄区上限（超过进红区），基准 100 的百分比
	# Default: 82.0
	# Range: 1.0 ~ 100.0
	yellowMax = 82
	#鱼线开始深红闪烁的张力值（基准 100 的百分比）
	# Default: 98.0
	# Range: 1.0 ~ 100.0
	criticalFlash = 98
	#基础张力回复速率（点/tick，放线时由红转白的速度）
	# Default: 1.6
	# Range: 0.0 ~ 20.0
	baseRecover = 1.6

#咬钩等待 / Bite timing（玩家扛不住长时间干等，上限压到 20 秒）
[bite]
	#最短等待秒数
	# Default: 10.0
	# Range: 0.1 ~ 60.0
	minWaitSeconds = 10
	#最长等待秒数的随机量（实际等待 = min + rand × 本值）
	# Default: 14.0
	# Range: 0.1 ~ 120.0
	maxWaitSeconds = 14
	#硬上限秒数（任何修正后都不得超过）
	# Default: 30.0
	# Range: 1.0 ~ 300.0
	hardCapSeconds = 30
	#等待下限秒数（台钓减时 + 打窝叠加后也不会低于它；用户定案 3 秒）
	# Default: 3.0
	# Range: 0.1 ~ 60.0
	floorSeconds = 3
	#台钓竿专属：咬钩等待下降百分比（路亚竿不吃这一项）
	# Default: 30.0
	# Range: 0.0 ~ 100.0
	floatRodCutPercent = 30
	#白档饵（0）的额外下降百分比
	# Default: 5.0
	# Range: 0.0 ~ 100.0
	baitCutWhitePercent = 5
	#绿档饵（1）的额外下降百分比
	# Default: 8.0
	# Range: 0.0 ~ 100.0
	baitCutGreenPercent = 8
	#蓝档饵（2）的额外下降百分比（当前没有蓝档饵，留给以后）
	# Default: 12.0
	# Range: 0.0 ~ 100.0
	baitCutBluePercent = 12
	#紫档饵（3，活虾）的额外下降百分比
	# Default: 16.0
	# Range: 0.0 ~ 100.0
	baitCutPurplePercent = 16
	#金档饵（4，发光饵）的额外下降百分比
	# Default: 18.5
	# Range: 0.0 ~ 100.0
	baitCutGoldPercent = 18.5
	#红档饵（5，秘制香饵）的额外下降百分比
	# Default: 21.0
	# Range: 0.0 ~ 100.0
	baitCutRedPercent = 21

#时间 / 天气 / 月相 / Time · Weather · Moon
#环境只改"水里此刻有哪些鱼愿意咬钩"，**不改咬钩节奏**（唯一例外见 biteNightCutPercent）。
#
#口径（用户定案）：受加成那一组鱼的**归一化总占比**最多提升这么多个百分点；
#组内每条鱼乘同一个倍率，倍率由池子反解得出（不写死）。
#只加不减 —— 组外鱼的权重不会被乘任何小于 1 的数。
[environment]
	#环境系统总开关（false = 完全回到未实现前的行为）
	enabled = true
	#时段组占比最多提升几个百分点（50/50 一种加成 → 40/60 就是 10）
	# Default: 10.0
	# Range: 0.0 ~ 20.0
	timeDeltaPct = 10
	#天气组占比最多提升几个百分点
	# Default: 10.0
	# Range: 0.0 ~ 20.0
	weatherDeltaPct = 10
	#月相：所有金红鱼一起分享的爆率预算（百分点）
	# Default: 5.0
	# Range: 0.0 ~ 15.0
	moonGoldRedDeltaPct = 5
	#月相：所有紫鱼一起分享的爆率预算（百分点）
	# Default: 15.0
	# Range: 0.0 ~ 30.0
	moonPurpleDeltaPct = 15
	#月相预算分法：0 = 组内同倍率（总和可能略微超出），1 = 按条数均摊（恰好用完预算）
	# Default: 1
	# Range: 0 ~ 1
	moonShareMode = 1
	#安全阀：任何一组的占比不得超过这个值（防极端池子算出组占比 100% 的倍率）
	# Default: 90.0
	# Range: 50.0 ~ 100.0
	shareCapPct = 90
	#在 HUD 上显示当前时段 / 天气 / 月相（一行小字）
	showCondition = true
	#调试：每次咬钩把环境与各组实际吃到的增量打到聊天栏
	logToChat = false
	#夜间台钓的咬钩等待减免百分比（0 = 关闭；只作用于夜晚 + 台钓竿）
	# Default: 10.0
	# Range: 0.0 ~ 50.0
	nightCutPercent = 10

#六槽配件属性合成 / Part attribute composition
#权重决定"某项属性由谁主导"，上限防止数值失控。
#详见 docs/11-配件系统详表.md §2。
[parts]
	#鱼线对张力上限的贡献权重
	# Default: 0.6
	# Range: 0.0 ~ 1.0
	lineOnTension = 0.6
	#鱼竿对张力上限的贡献权重
	# Default: 0.4
	# Range: 0.0 ~ 1.0
	rodOnTension = 0.4
	#鱼线对张力回复速度的贡献权重
	# Default: 0.6
	# Range: 0.0 ~ 1.0
	lineOnRecover = 0.6
	#鱼竿对张力回复速度的贡献权重
	# Default: 0.4
	# Range: 0.0 ~ 1.0
	rodOnRecover = 0.4
	#渔轮对体力削减的贡献权重
	# Default: 0.6
	# Range: 0.0 ~ 1.0
	reelOnDrain = 0.6
	#鱼竿对体力削减的贡献权重
	# Default: 0.4
	# Range: 0.0 ~ 1.0
	rodOnDrain = 0.4
	#张力上限倍率硬上限
	# Default: 3.0
	# Range: 1.0 ~ 10.0
	capTensionCeiling = 3
	#张力回复倍率硬上限（放线时由红转白的速度）
	# Default: 2.2
	# Range: 1.0 ~ 10.0
	capTensionRecover = 2.2
	#体力削减倍率硬上限
	# Default: 2.6
	# Range: 1.0 ~ 10.0
	capStaminaDrain = 2.6
	#回拉速度倍率硬上限
	# Default: 2.3
	# Range: 1.0 ~ 10.0
	capPull = 2.3
	#压制阻尼倍率硬上限
	# Default: 2.7
	# Range: 1.0 ~ 10.0
	capDamping = 2.7
	#不挣扎时基础回拉速度（格/tick）
	# Default: 0.15
	# Range: 0.001 ~ 2.0
	pullIdleBase = 0.15
	#挣扎时基础回拉速度（格/tick）
	# Default: 0.35
	# Range: 0.001 ~ 2.0
	pullStruggleBase = 0.35
	#收线时每秒扣掉的鱼力比例（相对满体力）
	# Default: 0.2
	# Range: 0.001 ~ 5.0
	staminaDrainBase = 0.2

#窝料 / Chum（做成实体、会散开、时长按窝料档次）
#注意：时长是**每种窝料自己的**（ChumItem 构造参数，30~300 分钟档），
#所以这里没有"全局时长"配置 —— 那种配置要么被忽略、要么把档次差异抹平。
[chum]
	#粒子生成间隔（tick）；越大越省性能
	# Default: 6
	# Range: 1 ~ 200
	particleIntervalTicks = 6
	#每次生成的粒子数（批量生成，降低总粒子量）
	# Default: 6
	# Range: 1 ~ 32
	particlesPerBurst = 6
	#窝子半径（格）——白圈画的就是这个半径
	# Default: 10.0
	# Range: 1.0 ~ 64.0
	radius = 10
	# 全服同时存在的窝料上限（条） 用户 2026-10-11 定案："全服至多存在 40 个窝料"—— 防的是 "一个人一直打窝、全队跟着吃"。到期的窝料自己会释放名额， 所以这个数是**同时存在**的条数，不是"每人能打多少"。 数为 0 或负数时按 1 处理（mod 内部夹取）。
	serverCap = 40

#耐久 / Durability（咬钩即扣，与是否切线逃离无关）
[durability]
	#每次咬钩扣除的鱼竿耐久（还会再乘竿的材质系数）
	# Default: 2
	# Range: 0 ~ 100
	rodPerBite = 2
	#每次鱼咬钩扣除的鱼线耐久
	# Default: 1
	# Range: 0 ~ 100
	linePerBite = 1
	#每次鱼咬钩扣除的拟饵耐久
	# Default: 1
	# Range: 0 ~ 100
	lurePerBite = 1
	#断线时额外扣除的鱼线耐久
	# Default: 5
	# Range: 0 ~ 100
	linePerBreak = 5

#配件数值 / Part stats（每个配件的属性）。
#由 tools/gen-part-config.js 从 ModItems.java 生成，默认值与代码里的原值一一对应，
#所以不改这些项时手感和以前完全一样。
#耐久上限是注册期固定的，改它要重启游戏；其余属性热重载即生效。
