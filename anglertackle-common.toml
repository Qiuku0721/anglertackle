	# Default: 0.9
	# Range: 0.0 ~ 1.0
	hookCameraFollowStrength = 0.9
	#收线时视野缩到原来的百分之几 / Zoom while reeling
	#⚠ **相对当前 FOV 相乘**，不是写死一个数值 —— 所以它是叠在其它视野效果
