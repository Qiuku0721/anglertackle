#渲染与实体同步 / Rendering
#注意：实体追踪范围（clientTrackingRange）是**注册期常量**，
#运行时改配置改不动它，所以这里不提供该项 —— 免得改了没反应。
#超出视距时的兜底靠"幽灵鱼线"，见 docs/09-原版冲突与渲染优化.md。
[render]
	#超过该距离改用简化线型（格）
	# Default: 64
	# Range: 8 ~ 256
	ghostLineBeyondBlocks = 64
	#上钩后视角跟随鱼钩 / Camera follows the hook
