#鱼种数值 / Per-fish stats（每条鱼的体重与对抗手感）。
#由 tools/gen-fish-config.js 从 FishSpecies.java 生成，默认值与代码里的原值一一对应，
#所以不改这些项时手感和以前完全一样。
#改完 /atl config reload 即生效：只影响之后咬钩的鱼，不影响正在遛的那条。
#每条的 13 项含义相同：体重上下限、拉力（不挣扎/疲劳期）、体力、张力涨速、
#冲刺时长与间隔、变向间隔、假动作概率、进疲劳的体力比例、疲劳持续、不挣扎时回气。
#
[fishStats]
	#鲫鱼（crucian_carp） · 体重下限（kg） —— 这种鱼最小能有多重。⚠ 它和体重上限一起决定档位怎么分——改小了会让低档鱼变少
	# Default: 0.1
	# Range: 0.001 ~ 500.0
	crucianCarpMinKg = 0.1
	#鲫鱼（crucian_carp） · 体重上限（kg） —— 这种鱼最大能有多重。线长/承重不够时会钓不上来（见 buildPool 的承重过滤）
	# Default: 1.2
	# Range: 0.001 ~ 500.0
	crucianCarpMaxKg = 1.2
	#鲫鱼（crucian_carp） · 拉力（不挣扎） —— 挣扎时把线拽出去的速度。越大越拉不动。这是「上钩两秒就能感觉出多大」的主要来源。⚠ 这是**基准值**：实际游速 = 本值 × 档位曲线 1.12^档 × 金/红手感修正（金 ×0.84、红 ×1.05）
	# Default: 0.7
	# Range: 0.0 ~ 20.0
	crucianCarpPullSpeed = 1.05
	#鲫鱼（crucian_carp） · 拉力（疲劳期） —— 遛到疲劳后的拉拽速度。默认 = 正常拉力 × gameplay.fatiguePullMultiplier（当前 0.5）—— 改大就等于「疲劳期反而不划算」
	# Default: 0.35
	# Range: 0.0 ~ 20.0
	crucianCarpFatiguedPullSpeed = 0.441
	#鲫鱼（crucian_carp） · 体力上限 —— 鱼有多少体力。越大越耐磨，要遛更久。它是「持久战」强度的总开关。⚠ 这是**基准值**（按鱼种）：实际体力池 = 本值 × 档位倍率（金档 ×1.0、红档 ×1.5）。红档还有一条**基准下限**（gameplay.tierRedStaminaMin，默认 200）：基准低于它的红档鱼先被抬到下限，再乘倍率 —— 否则台钓唯一的红鱼（蓝宝石雷龙鱼 130）比一条普通草鱼还好遛。咬钩时日志里会打一行「体力池：X = 基准 Y × 档位倍率 Z」——对账看那一行，别看这里的基准
	# Default: 80.0
	# Range: 1.0 ~ 5000.0
	crucianCarpStamina = 80
	#鲫鱼（crucian_carp） · 张力涨速 —— 这条鱼让线涨得多快。>1 = 线黄得快（黏液型鱼的味道），<1 = 宽容
	# Default: 0.9
	# Range: 0.0 ~ 5.0
	crucianCarpTensionGain = 0.9
	#鲫鱼（crucian_carp） · 冲刺时长（秒） —— 每次冲刺持续几秒。0 = 这条鱼不冲刺
	# Default: 0.6
	# Range: 0.0 ~ 60.0
	crucianCarpSprintDurationSec = 0.6
	#鲫鱼（crucian_carp） · 冲刺间隔（秒） —— 每隔几秒冲一次。越小越凶（爆发型 2.6，黏液型 8.0 几乎不冲）
	# Default: 5.5
	# Range: 0.1 ~ 60.0
	crucianCarpSprintIntervalSec = 5.5
	#鲫鱼（crucian_carp） · 变向间隔（秒） —— 每隔几秒变一次向。越小越神经质（神经质型 1.3，黏液型 5.5 方向很稳）
	# Default: 4.5
	# Range: 0.2 ~ 60.0
	crucianCarpTurnIntervalSec = 4.5
	#鲫鱼（crucian_carp） · 假动作概率（0~1） —— 假动作概率：预告一个方向、实际往反方向跑。0~1（神经质型 0.35）
	# Default: 0.0
	# Range: 0.0 ~ 1.0
	crucianCarpFakeOutChance = 0
	#鲫鱼（crucian_carp） · 进疲劳的体力比例（0~1） —— 体力降到这个比例以下就进疲劳期（0.3 = 剩 30% 时）
	# Default: 0.3
	# Range: 0.01 ~ 1.0
	crucianCarpFatigueThreshold = 0.3
	#鲫鱼（crucian_carp） · 疲劳持续（秒） —— 疲劳期持续几秒。这段时间是反拉的最佳窗口
	# Default: 2.0
	# Range: 0.0 ~ 120.0
	crucianCarpFatigueDurationSec = 2
	#鲫鱼（crucian_carp） · 不挣扎时回气（/s） —— 不挣扎时每秒回多少体力（会被渔轮阻尼压制）。越大越难遛翻
	# Default: 0.02
	# Range: 0.0 ~ 1.0
	crucianCarpStaminaRegen = 0.02
