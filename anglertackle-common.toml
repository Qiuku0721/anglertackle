[quest]
	# 委托系统总开关 关掉之后：不再投递委托信、也不再记进度（已接的委托**保留在存档里不动**）。 做这个开关是为了出问题时能一键停掉，不用回滚版本。
	enable = true
	# 每游戏日投递的每日委托条数 默认 5（用户 2026-10-14：每天 5 种可做，池子种类更多）。
	dailyCount = 5
	# 每游戏周投递的周常委托条数 默认 5（用户口径同上）。
	weeklyCount = 5
	# 完成一个每日委托给多少活跃度 用户定案 3；一周最多 5 条 x 3 = 15。
	activityPerDaily = 3
	# 完成一个周常委托给多少活跃度 用户定案 8；一周 5 条 = 40。
	activityPerWeekly = 8
	# 每周活跃度上限（用户定案 100） 满档不用满勤：5 条周常 40 + 每日 4 天 x 15 = 100，够得到。 四个档位奖励在 25 / 50 / 75 / 100 各发一次。
	activityCapWeekly = 100
