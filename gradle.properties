# ============================================================
#  《垂纶》Angler's Tackle — Gradle 属性
#  Mod ID: anglertackle   作者: 白钴 / White Cobalt
# ============================================================

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存能显著加快重复构建；如果遇到插件兼容问题，把下面这行注释掉
# 配置缓存：MDG 的 createMinecraftArtifacts 任务无法序列化，故关闭
org.gradle.configuration-cache=false

# ---- 本地 JDK 21 ----
# ⚠ 这里【故意不写】org.gradle.java.home。
#
# 原因：Gradle 以 ISO-8859-1 读取本文件，而本项目的绝对路径包含中文
# （...\我的世界\我的世界mod\...）。写在这里会变成乱码
#   Value 'C:/Users/.../æçä¸çmod/.jdk/jdk-21.0.12.1+1' ... is invalid
# 并导致构建直接失败。
#
# 正确做法有两种：
#   1) 用封装脚本（推荐）：  tools\gradlew.cmd build
#      它会把 JDK 路径用命令行参数传给 Gradle，完全绕开编码问题。
#   2) 手动传参：           gradle build "-Dorg.gradle.java.home=<绝对路径>"
#
# 如果将来把项目移到纯 ASCII 路径（例如 C:\dev\anglers-tackle），
# 就可以取消下面这行的注释，恢复成普通的 gradle.properties 配置：
#org.gradle.java.home=C:/dev/anglers-tackle/.jdk/jdk-21.0.12.1+1

# ---- 模组元数据 ----
mod_id=anglertackle
mod_name=Angler's Tackle
mod_license=MIT
mod_version=1.6.18
mod_group_id=com.whitecobalt.anglertackle
mod_authors=White Cobalt (白钴)
mod_description=A fishing mod built around feel: physical casting, float reading, line tension fighting, six-slot tackle customization, a fish codex and certificates.

# ---- Minecraft / NeoForge 版本 ----
# 1.21.1 对应的 NeoForge 是 21.1.x（21.1.252 为镜像上查到的当前版本）
# 英文 1.21.1 = 1.21.1
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.252
neo_version_range=[21.1.0,)
loader_version_range=[4,)

