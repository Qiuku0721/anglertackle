modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/"

# 垂纶 × 森罗物语 扩展包
#
# ⚠ 这是一个**独立 jar**，故意不并进主 jar：
#   主 jar 不许出现他们任何类的名字（无编译依赖，见 tools/check-kaleidoscope-compat.js 断言 6），
#   而这个 jar 必须 compileOnly 他们的 jar 才能调他们的公开 API。
#
# ⚠⚠ 2026-10-12 **实测纠正（原来那句注释写错了，害用户开不了游戏 ✗）**：
#   原文声称"**没装森罗也能正常加载**" —— **实测是错的** ✗（检查器里钉着那句原话，不许它回来）。
#   FML 对 **required 依赖缺失**的处理是**判定 mod 加载失败并崩游戏**：
#       Mod anglertackle_kaleidoscope requires kaleidoscope_cookery 1.4.0 or above
#       Currently, kaleidoscope_cookery is not installed  →  Mod loading has failed
#   ⇒ 这个包**只能装进"确实装了森罗"的实例**：由 tools/build-deploy.ps1 按目标 mods 里
#     有没有启用的森罗来决定拷不拷，并且**尊重** PCL 的 `.jar.disabled` 标记
#     （用户手动禁用它之后，部署不许把它重新打开 —— 2026-10-12 就是这么崩的 ✗）。
#   依赖仍必须是 `required`：本包直接调他们的公开 API，缺了就是 NoClassDefFoundError，
#   改成 optional 只是把"明确的报错"换成"运行到一半炸" ✗。
[[mods]]
modId = "anglertackle_kaleidoscope"
version = "1.0.0"
displayName = "垂纶 × 森罗物语（扩展包）"
authors = "White Cobalt (白钴)"
description = '''
让《垂纶》与《森罗物语》深度联动，且**不改动森罗的任何一行代码**：

· 砧板接管：整鱼放上他们的砧板、用鱼刀切 → 按**重量**出鱼块（带鱼种/档位数据）；
  鱼块放上去切 → 1:1 出鱼丸（继承鱼块的档位）。
· 汤锅数据保真：用他们的汤锅煮出来的鱼汤/奶白鱼汤/慢炖鱼，**带那条鱼的真实鱼种与档位**，
  饱食度与效果按真实档位结算（不再退化成"一口价"）。
· 音效与粒子走他们自己的 playParticlesSound，观感一致。

所有交互都通过他们的公开 API 与可取消事件实现（IChoppingBoard / StockpotMatchRecipeEvent），
没有 Mixin、没有字节码补丁、没有覆盖他们的任何 data 文件。
'''

[[dependencies.anglertackle_kaleidoscope]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.anglertackle_kaleidoscope]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.anglertackle_kaleidoscope]]
modId = "anglertackle"
type = "required"
versionRange = "[1.3.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.anglertackle_kaleidoscope]]
modId = "kaleidoscope_cookery"
type = "required"
versionRange = "[1.4.0,)"
ordering = "AFTER"
side = "BOTH"
